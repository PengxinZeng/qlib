# pipeline_us.yaml — 全天候投资模型数据收集配置（隔离数据集）
# 本配置用于纳指/标普500 相关实验，输出到独立数据根 all_weather_data_us，不影响原 all_weather_data

version: "1.0"
# output_base 由 run_pipeline.py 运行时把 __DATA_BASE__ 注入为绝对路径
output_base: __DATA_BASE__/all_weather_data_us

# YAML anchors：定义一次，各 pipeline 用 alias 引用
defaults:
  start: &start "2000-01-01"
  force: &force true   # true = 忽略已有数据，全量重新下载

# ── 阶段一：各数据源下载到 CSV ─────────────────────────────────────────
pipelines:
  # - name: cash_cn
  #   type: TencentETFCollector
  #   symbols:
  #     - {code: "000198", name: "南方现金增利",   index: ""}
  #     - {code: "003816", name: "华宝添益",       index: ""}
  #   fq_type: hfq
  #   start: *start
  #   force: *force
  #   output_dir: source/cash_cn

  # 纳指/标普500 相关 ETF（不复权价格 fq_type 留空；需 check 收益率一致性）
  # 隔离数据集：仅保留纳指(NDX)/标普500(SPX) 相关 ETF（原恒生科技/自由现金流已移除）
  - name: equity_cn_unadj
    type: TencentETFCollector
    symbols:
      - {code: "513300", name: "纳斯达克ETF华夏",      index: "NDX"}
      - {code: "159501", name: "纳指ETF嘉实",      index: "NDX"}
      - {code: "159696", name: "纳指ETF易方达",      index: "NDX"}
      - {code: "513500", name: "标普500ETF博时",      index: "SPX"}
      - {code: "513650", name: "标普500ETF南方",      index: "SPX"}
      - {code: "159655", name: "标普500ETF华夏",      index: "SPX"}
    fq_type: ""
    start: *start
    force: *force
    output_dir: source/equity_cn_unadj # 股票

  # 美股/指数（腾讯 usfqkline 接口，须用 TencentUSCollector；fq_type 必须 qfq/hfq）
  # code 不带 us 前缀（如 NDX），CSV/下游 symbol 即 NDX；历史可回溯至 2000-01-03
  # 注意：腾讯 usfqkline 仅对指数提供长历史（NDX/INX/DJI/IXIC）；美股ETF(如SPY)只返最近1天
  - name: us_index
    type: TencentUSCollector
    symbols:
      - {code: "NDX", name: "纳斯达克100指数",   index: "NDX"}
      # - {code: "DJI",  name: "道琼斯工业指数",   index: "DJI"}
      # - {code: "IXIC", name: "纳斯达克综合指数", index: "IXIC"}
      - {code: "INX",  name: "标普500指数",      index: "SPX"}   # SPY(美股ETF)无历史，改用指数 INX
    fq_type: qfq
    start: *start
    force: *force
    output_dir: source/us_index # 美股指数/ETF

  # - name: equity_us
  #   type: YahooCollector
  #   symbols: ["QQQ", "SPY", "EEM", "GLD", "SLV", "USO", "TLT", "IEF"]
  #   proxy: "http://127.0.0.1:7890"
  #   start: *start
  #   force: *force
  #   output_dir: source/equity_us # 股票

  # - name: commodity_metal
  #   type: AkshareCollector
  #   symbols:
  #     - {code: "XAU", source: "futures_index_unsh_sina"}
  #     - {code: "XAG", source: "futures_index_unsh_sina"}
  #     - {code: "CL0", source: "futures_zh_daily_sina"}
  #   start: *start
  #   force: *force
  #   output_dir: source/commodity_metal # 大宗商品、贵金属

  # - name: macro_cn
  #   type: MacroCollector
  #   indicators:
  #     - {name: "cn_bond_yield_10y", source: "eastmoney_bond_rate"}
  #     - {name: "cn_cpi",            source: "akshare_macro_china_cpi"}
  #     - {name: "cn_ppi",            source: "akshare_macro_china_ppi"}
  #   start: *start
  #   force: *force
  #   output_dir: source/macro_cn

# ── 阶段一.五：用人工统计数据校验下载结果 ──────────────────────────────
  - name: sanity_check
    type: SanityChecker
    source_dirs:
      - source/equity_cn_unadj
      - source/us_index
    anno_file: __REPO_ROOT__/EtfCompare/eft_data.csv
    tolerance: 1e-4
    report_path: sanity_check/report.csv

# ── 阶段二：合并各 CSV → merged CSV ──────────────────────────────────
  - name: merge
    type: AllWeatherMerger
    source_dirs:
      - source/equity_cn_unadj
      - source/us_index
    output_dir: merged

# ── 阶段二.四：可交易性过滤 merged CSV → filtered CSV ─────────────────────
#   以 volume 作代理：无成交量(NaN 或 <= min_value)的不可交易日，
#   将 open/high/low/close/volume 全部置 NaN；volume 整列全 NaN 的标的(如场外基金)整体跳过。
  - name: filter_tradability
    type: TradabilityFilter
    input_dir: merged
    output_dir: filtered
    field: volume
    min_value: 0
    skip_if_all_missing: true

# ── 阶段二.五：尖刺清洗 filtered CSV → cleaned CSV ─────────────────────────
  - name: clean_spikes
    type: SpikeCleaner
    input_dir: filtered
    output_dir: cleaned
    spike_threshold: 0.40

# ── 阶段二.五五：数据集切分（按累计可交易量）────────────────────────────────
#   close 非 NaN = 可交易；切分方案(集合名/比例)在此配置，ratio 之和须为 1.0
  - name: split
    type: DatasetSplitter
    input_dir: cleaned
    output_dir: dataset_split
    splits:
      - {name: train,   ratio: 0.25}
      - {name: valid,   ratio: 0.25}
      - {name: test, ratio: 0.25}
      - {name: testB,  ratio: 0.25}

# ── 阶段二.六：可视化 cleaned CSV → 归一化走势图 ─────────────────────────
  - name: visualize
    type: EtfVisualizer
    input_dir: cleaned
    output_dir: data_distribution/AllETF
    split_file: dataset_split/split_by_cumsum.csv

# ── 阶段三：dump cleaned CSV → Qlib 二进制格式 ───────────────────────────
  - name: dump
    type: QlibDumper
    data_path: cleaned
    qlib_dir: qlib_all_weather
    freq: day
    max_workers: 16

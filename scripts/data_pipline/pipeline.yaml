# ── 阶段一.五：用人工统计数据校验下载结果 ──────────────────────────────
  - name: sanity_check
    type: SanityChecker
    source_dirs:
      - source/equity_cn
      - source/equity_cn_unadj
      - source/commodity_metal_etf
    anno_file: /Users/zengpengxin/workspace/CodeBase/qlib/EtfCompare/eft_data.csv
    tolerance: 1e-4
    report_path: sanity_check/report.csv

# ── 阶段二：合并各 CSV → merged CSV ──────────────────────────────────
  - name: merge
    type: AllWeatherMerger
    source_dirs:
      - source/cash_cn
      - source/bond_cn
      - source/equity_cn
      - source/equity_cn_unadj
      - source/equity_us
      - source/commodity_metal
      - source/commodity_metal_etf
      - source/macro_cn
    output_dir: merged

# ── 阶段二.四：可交易性过滤 merged CSV → filtered CSV ─────────────────────
#   以 volume 作代理：无成交量(NaN 或 <= min_value)的不可交易日，
#   将 open/high/low/close/volume 全部置 NaN；volume 整列全 NaN 的标的(如场外基金)整体跳过。
  - name: filter_tradability
    type: TradabilityFilter
    input_dir: merged
    output_dir: filtered
    field: volume
    min_value: 0
    skip_if_all_missing: true

# ── 阶段二.五：尖刺清洗 filtered CSV → cleaned CSV ─────────────────────────
  - name: clean_spikes
    type: SpikeCleaner
    input_dir: filtered
    output_dir: cleaned
    spike_threshold: 0.40

# ── 阶段二.五五：数据集切分（按累计可交易量）────────────────────────────────
#   close 非 NaN = 可交易；切分方案(集合名/比例)在此配置，ratio 之和须为 1.0
  - name: split
    type: DatasetSplitter
    input_dir: cleaned
    output_dir: dataset_split
    splits:
      - {name: train,   ratio: 0.25}
      - {name: valid,   ratio: 0.25}
      - {name: test, ratio: 0.25}
      - {name: testB,  ratio: 0.25}

# ── 阶段二.六：可视化 cleaned CSV → 归一化走势图 ─────────────────────────
  - name: visualize
    type: EtfVisualizer
    input_dir: cleaned
    output_dir: data_distribution/AllETF
    split_file: dataset_split/split_by_cumsum.csv

# ── 阶段三：dump cleaned CSV → Qlib 二进制格式 ───────────────────────────
  - name: dump
    type: QlibDumper
    data_path: cleaned
    qlib_dir: qlib_all_weather
    freq: day
    max_workers: 16

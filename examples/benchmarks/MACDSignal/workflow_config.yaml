qlib_init:
    provider_uri: "/Users/zengpengxin/workspace/DataBase/Quant/QlibBase/qlib_data_260415/qlib_etf_index_Extend_wBond"
    region: cn

mlflow_tracking_uri: "file:./mlruns"
experiment_name: macd_signal_etf

market: &market all
benchmark: &benchmark "510050_CLEAN"

time_config:
    data_start: &data_start "2005-02-23"
    data_end: &data_end "2026-05-30"
    train_start: &train_start "2005-02-23"
    train_end: &train_end "2017-01-03"
    valid_start: &valid_start "2017-01-04"
    valid_end: &valid_end "2019-10-08"
    # backtest_start: &backtest_start "2005-02-23"
    # backtest_end: &backtest_end "2019-10-08"
    backtest_start: &backtest_start "2019-10-09"
    backtest_end: &backtest_end "2026-04-13"

port_analysis_config: &port_analysis_config
    strategy:
        class: EvenWeightStrategy
        module_path: qlib.contrib.strategy.signal_strategy
        kwargs:
            signal: <PRED>
            risk_degree: 1.0
            max_stock_weight: 1.0
    backtest:
        start_time: *backtest_start
        end_time: *backtest_end
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
            trade_unit: 0.001

task:
    model:
        class: MACDSignalModel
        module_path: qlib.contrib.model.macd_signal
        kwargs:
            fast: 11
            slow: 37
            signal: 6

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: RawFieldsHandler
                module_path: qlib.contrib.data.handler_raw_fields
                kwargs:
                    start_time: *data_start
                    end_time: *data_end
                    fit_start_time: *train_start
                    fit_end_time: *train_end
                    instruments: *market
                    fields:
                        - "$close"
                        - "$volume"
                    field_names:
                        - "close"
                        - "volume"
                    infer_processors:
                        - class: ProcessInf
                          kwargs: {}
                    learn_processors:
                        - class: ProcessInf
                          kwargs: {}
            segments:
                train: [*train_start, *train_end]
                valid: [*valid_start, *valid_end]
                test: [*backtest_start, *backtest_end]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>

        # - class: SignalDetailRecord
        #   module_path: qlib.workflow.record_temp
        #   kwargs:
        #     skip_existing: False

        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

        # - class: ReportRecord
        #   module_path: qlib.workflow.record_temp
        #   kwargs:
        #     dataset: <DATASET>
        #     freq: "1day"

        # - class: MACDSignalChartRecord
        #   module_path: qlib.workflow.record_temp
        #   kwargs:
        #     dataset: <DATASET>

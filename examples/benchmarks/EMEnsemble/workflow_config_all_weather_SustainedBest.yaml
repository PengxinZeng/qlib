qlib_init:
    provider_uri: "/Users/zengpengxin/workspace/DataBase/Quant/QlibBase/all_weather_data/qlib_all_weather"
    region: cn

mlflow_tracking_uri: "file:./mlruns"
experiment_name: em_ensemble_sustainedbest_all_weather

market: &market all
benchmark: &benchmark "510300"

# 时间参数配置（取自 all_weather_data/dataset_split/split_info.json）
time_config:
    data_start: &data_start "2012-05-28"
    data_end: &data_end "2026-08-15"
    train_start: &train_start "2012-05-28"
    train_end: &train_end "2018-04-18"
    valid_start: &valid_start "2018-04-19"
    valid_end: &valid_end "2021-11-12"
    backtest_start: &backtest_start "2012-05-28"
    backtest_end: &backtest_end "2026-08-15"

port_analysis_config: &port_analysis_config
    strategy:
        class: EvenWeightStrategy
        module_path: qlib.contrib.strategy.signal_strategy
        kwargs:
            signal: <PRED>
            risk_degree: 1.0
            max_stock_weight: 1.0
    backtest:
        start_time: *backtest_start
        end_time: *backtest_end
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
            trade_unit: 0.0001

task:
    model:
        class: EMEnsembleModel
        module_path: qlib.contrib.model.em_ensemble
        kwargs:
            # 模型列表：每个元素为 {name, interpreter}
            models:
                - name: emval
                  interpreter:
                    class: ValuationInterpreter
                    module_path: qlib.contrib.model.em_ensemble
                    kwargs:
                      # 正确配对：emval 指向 em_val_all_weather 实验（264173616341034074）覆盖回测区间的最新 run
                      exp_path: "/Users/zengpengxin/workspace/CodeBase/qlib/mlruns/264173616341034074/903542eb48e04aebae3642803c15e336"
                      buy_rank_thre: 0.32
                      sell_rank_thre: 0.88
                      min_buy_days: 5
                      min_signal_days: 2
                - name: emval_womom
                  interpreter:
                    class: ValuationInterpreter
                    module_path: qlib.contrib.model.em_ensemble
                    kwargs:
                      # 正确配对：emval_womom 指向 em_val_all_weather_womom 实验（353993812794722495）覆盖回测区间的最新 run
                      exp_path: "/Users/zengpengxin/workspace/CodeBase/qlib/mlruns/353993812794722495/ae96aa19abb9448bb41e05c80f33ef39"
                      buy_rank_thre: 0.07
                      sell_rank_thre: 0.94
                      min_buy_days: 5
                      min_signal_days: 2
                - name: all_in
                  interpreter:
                      class: ConstantInterpreter
                      module_path: qlib.contrib.model.em_ensemble
                      kwargs:
                          soft_signal: 1.0
                          score: 1.0
                - name: never_buy
                  interpreter:
                      class: ConstantInterpreter
                      module_path: qlib.contrib.model.em_ensemble
                      kwargs:
                          soft_signal: -1.0
                          score: -1.0
            # 模型组装器
            assembler:
                class: ReturnBasedAssembler
                module_path: qlib.contrib.model.em_ensemble
                kwargs:
                    # 策略 A：模型选择 —— 持续最优切换（测试开始日锁定最优 M，其他模型持续优于 M 达 N=256 天才切换）
                    selector:
                        class: SustainedBestSelector
                        module_path: qlib.contrib.model.em_ensemble
                        kwargs:
                            N: 256
                            follow_signal: true   # true: follow current model signals; false: one-hot x soft
                    # 策略 B：信号增强 —— 锁定模式与 overtake 互斥，缺省 NoOpEnhancer（可显式声明）
                    enhancer:
                        class: NoOpEnhancer
                        module_path: qlib.contrib.model.em_ensemble
                        kwargs: {}

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: RawFieldsHandler
                module_path: qlib.contrib.data.handler_raw_fields
                kwargs:
                    start_time: *data_start
                    end_time: *data_end
                    fit_start_time: *train_start
                    fit_end_time: *train_end
                    instruments: *market
                    # all_weather_data 仅 dump 了 OHLCV 字段
                    fields:
                        - "$close"
                        - "$volume"
                    field_names:
                        - "close"
                        - "volume"
                    # OHLCV 无 inf、MACD 自行处理 NaN，故不需要 processor
                    infer_processors: []
                    learn_processors: []
            segments:
                train: [*train_start, *train_end]
                valid: [*valid_start, *valid_end]
                # test 段直接写实际回测区间（backtest_start→backtest_end）：
                # EMEnsembleModel 内部通过 lookback_days 自动加载前序数据，
                # 使 ReturnBasedAssembler 的 cum_ret 仍从股票数据起点复利累计
                test: [*backtest_start, *backtest_end]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>

        - class: SignalDetailRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            skip_existing: False

        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

        - class: ReportRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            dataset: <DATASET>
            freq: "1day"
            figure_timeout: 30   # 单张图导出超时(秒)，超时跳过避免 kaleido 卡死

        - class: EMEnsembleChartRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            dataset: <DATASET>

# nohup python -u qlib/cli/run.py  examples/benchmarks/EMEnsemble/workflow_config_all_weather_SustainedBest.yaml > output/EMEnsemble_SustainedBest_TV.log 2>&1 &

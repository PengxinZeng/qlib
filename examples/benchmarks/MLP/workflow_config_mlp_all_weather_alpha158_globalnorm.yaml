qlib_init:
    # 运行时由 daily_update.py / 环境变量注入数据根绝对路径
    provider_uri: "{{ QLIB_DATA_BASE | default('/Users/zengpengxin/workspace/DataBase/Quant/QlibBase') }}/all_weather_data/qlib_all_weather"
    region: cn

mlflow_tracking_uri: "file:./mlruns"
experiment_name: mlp_all_weather_alpha158_globalnorm

market: &market all
benchmark: &benchmark "510300"

# 时间参数配置（取自 all_weather_data/dataset_split/split_info.json）
time_config:
    data_start: &data_start "2012-05-28"
    data_end: &data_end "2026-08-16"
    train_start: &train_start "2012-05-28"
    train_end: &train_end "2018-04-18"
    valid_start: &valid_start "2018-04-19"
    valid_end: &valid_end "2021-11-12"
    backtest_start: &backtest_start "2021-11-15"
    backtest_end: &backtest_end "2026-08-16"


port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 5
            n_drop: 1
    backtest:
        start_time: *backtest_start
        end_time: *backtest_end
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
            trade_unit: 0.0001

task:
    model:
        class: DNNModelPytorch
        module_path: qlib.contrib.model.pytorch_nn
        kwargs:
            loss: mse
            lr: 0.002
            optimizer: adam
            max_steps: 3000
            batch_size: 512
            GPU: 0           # 无 CUDA 时自动回退 CPU
            weight_decay: 0.0002
            seed: 0          # 与基准版（seed0/CSZScoreNorm）公平对比：固定相同 seed
            ic_skip_size: 10   # all_weather 仅 ~23 只标的，按日 IC 最小样本数需调低（默认 50）
            pt_model_kwargs:
              input_dim: 157   # Alpha158OHLCV 158 维 - DropCol(VWAP0) 1 列 = 157，与标准 Alpha158 对齐

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158OHLCV
                module_path: qlib.contrib.data.handler
                kwargs:
                    start_time: *data_start
                    end_time: *data_end
                    fit_start_time: *train_start
                    fit_end_time: *train_end
                    instruments: *market
                    process_type: "independent"
                    infer_processors:
                        - class: DropCol
                          kwargs:
                            col_list: ["VWAP0"]
                        - class: CSZFillna
                          kwargs:
                            fields_group: feature
                        - class: Fillna
                    # 修改点：label 标准化由 CSZScoreNorm（按日横截面 zscore，每日仅 12~18 只
                    # 标的，std 估计噪声大）改为 ZScoreNorm（用 train 段全部交易日+标的的
                    # 全局 mean/std 标准化，时序稳定、不放大单日小样本噪声）。
                    # ZScoreNorm 的 fit 仅用 [fit_start_time, fit_end_time]=train 段，
                    # 不会泄漏 valid/test 信息。
                    learn_processors:
                        - class: DropCol
                          kwargs:
                            col_list: ["VWAP0"]
                        - class: DropnaProcessor
                          kwargs:
                            fields_group: feature
                        - class: DropnaLabel
                        - class: ZScoreNorm
                          kwargs:
                            fields_group: label
                        - class: DropnaLabel
            segments:
                train: [*train_start, *train_end]
                valid: [*valid_start, *valid_end]
                test: [*backtest_start, *backtest_end]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>

        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252

        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

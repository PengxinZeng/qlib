qlib_init:
    # 运行时由 daily_update.py / 环境变量注入数据根绝对路径
    provider_uri: "{{ QLIB_DATA_BASE | default('/Users/zengpengxin/workspace/DataBase/Quant/QlibBase') }}/all_weather_data/qlib_all_weather"
    region: cn

mlflow_tracking_uri: "file:./mlruns"
experiment_name: mlp_all_weather_alpha158_zscore_s1

market: &market all
benchmark: &benchmark "510300"

# 时间参数配置（取自 all_weather_data/dataset_split/split_info.json）
time_config:
    data_start: &data_start "2012-05-28"
    data_end: &data_end "2026-08-16"
    train_start: &train_start "2012-05-28"
    train_end: &train_end "2018-04-18"
    valid_start: &valid_start "2018-04-19"
    valid_end: &valid_end "2021-11-12"
    # 与 8.69% 原 run 完全一致：test 段与回测均从 2021-11-12 开始（非 2021-11-15）
    backtest_start: &backtest_start "2021-11-12"
    backtest_end: &backtest_end "2026-08-16"

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 5
            n_drop: 1
    backtest:
        start_time: *backtest_start
        end_time: *backtest_end
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
            trade_unit: 0.0001

task:
    model:
        class: DNNModelPytorch
        module_path: qlib.contrib.model.pytorch_nn
        kwargs:
            loss: mse
            lr: 0.002
            optimizer: adam
            max_steps: 3000
            batch_size: 512
            GPU: 0           # 无 CUDA 时自动回退 CPU
            weight_decay: 0.0002
            seed: 1          # 固定随机种子：np.random.seed + torch.manual_seed，训练可复现
            ic_skip_size: 10   # all_weather 仅 ~23 只标的，按日 IC 最小样本数需调低（默认 50）
            pt_model_kwargs:
              input_dim: 158   # 全量 158 维输入（vwap0_mode: close → 第 12 列为 CLOSE0 常数列）

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158OHLCV
                module_path: qlib.contrib.data.handler
                kwargs:
                    start_time: *data_start
                    end_time: *data_end
                    fit_start_time: *train_start
                    fit_end_time: *train_end
                    instruments: *market
                    # 复现 8.69% 年化配置（对齐 base 前）：
                    #   vwap0_mode: close → 第 12 列 = CLOSE0 = $close/$close = 常数 1
                    #     （8.69% 原 run 的原始特征；当前 handler 默认 approx 为加权典型价近似）
                    #   infer: ProcessInf + ZScoreNorm + Fillna（按日截面标准化，小截面必需）
                    #   learn: DropnaLabel + DropnaProcessor(feature) + CSZScoreNorm(label)
                    #          + 末尾 DropnaLabel（单样本日除零产 NaN 再清）
                    # 特征保留全部 158 维（CLOSE0 常数列，不 DropCol）
                    vwap0_mode: close
                    infer_processors:
                        - class: ProcessInf
                        - class: ZScoreNorm
                        - class: Fillna
                    learn_processors:
                        - class: DropnaLabel
                        - class: DropnaProcessor
                          kwargs:
                            fields_group: feature
                        - class: CSZScoreNorm
                          kwargs:
                            fields_group: label
                        - class: DropnaLabel
            segments:
                train: [*train_start, *train_end]
                valid: [*valid_start, *valid_end]
                test: [*backtest_start, *backtest_end]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>

        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252

        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

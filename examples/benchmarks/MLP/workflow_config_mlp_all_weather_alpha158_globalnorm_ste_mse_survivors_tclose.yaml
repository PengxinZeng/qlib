qlib_init:
    # 运行时由 daily_update.py / 环境变量注入数据根绝对路径
    provider_uri: "{{ QLIB_DATA_BASE | default('/Users/zengpengxin/workspace/DataBase/Quant/QlibBase') }}/all_weather_data/qlib_all_weather"
    region: cn

mlflow_tracking_uri: "file:./mlruns"
experiment_name: mlp_all_weather_alpha158_globalnorm_ste_mse_survivors_tclose

market: &market train_survivors   # 排除 Train 阶段(2018-04-18)未上市的标的，仅 12 只
benchmark: &benchmark "510300"

# 时间参数配置（E2：valid=TrainVal，test=AB）
time_config:
    data_start: &data_start "2012-05-28"
    data_end: &data_end "2026-08-16"
    train_start: &train_start "2012-05-28"
    train_end: &train_end "2018-04-18"
    valid_start: &valid_start "2012-05-28"      # TrainVal：train+valid 合并作早停段
    valid_end: &valid_end "2021-11-12"
    backtest_start: &backtest_start "2021-11-15"  # AB
    backtest_end: &backtest_end "2026-07-17"


port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 5
            n_drop: 1
            signal_shift: 0    # 用当日信号 → t 日成交（配合 deal_price=close 即 t 日收盘成交）；
                              # 与 handler label=Ref($close,-1)/$close-1（t日买入持有1日收益）同口径
    backtest:
        start_time: *backtest_start
        end_time: *backtest_end
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close   # t 日收盘成交
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
            trade_unit: 0.0001

task:
    model:
        class: DNNModelPytorch
        module_path: qlib.contrib.model.pytorch_nn
        kwargs:
            # loss=portfolio_mse: 组合收益项 + MSE 项加权混合。
            #   组合项：softmax 加权组合收益（梯度=目标，每日≥min_days_size 只即可），
            #          hard top5 等权收益用于验证/评测（与 TopkDropoutStrategy 同口径）。
            #   MSE 项：对 label 的逐标的回归目标，约束预测尺度/正则化，缓解小池子过拟合。
            #   loss = w * portfolio_loss + (1-w) * MSE，w=portfolio_weight。
            # τ 从 0.2 退火到 0.1 让 softmax 逼近 top-k。
            # label 已改为 t+1 收益（见 handler），训练/val/IC 全部对齐 t 日收盘成交。
            loss: portfolio_mse
            portfolio_weight: 0.5   # 组合收益项权重；0.5 让组合目标主导（portfolio ~1e-2 vs MSE ~1e-3 量级）
            lr: 0.002
            optimizer: adam
            max_steps: 3000
            eval_steps: 100        # 每 100 步验证一次（3000 步共 30 个检查点，粒度足够）
            early_stop_rounds: 10  # 10 次 eval 无改进即停 ≈ 1000 步，与原 20×50 等价
            batch_size: 512      # portfolio 模式忽略，按 dates_per_step 整日采样
            GPU: 0               # 无 CUDA 时自动回退 CPU
            weight_decay: 0.0002
            seed: 0
            min_days_size: 2     # portfolio 训练：每日 ≥2 只标的即可（softmax 梯度不要求凑满 topk）
            topk: 5              # 组合持仓数（hard 评测口径 + 回测策略）
            tau: 0.2             # softmax 温度（退火起点）
            tau_min: 0.1         # 退火终点
            anneal_steps: 2000   # τ 从 0.2 线性退火到 0.1 的步数
            turnover_penalty: 0.0  # v1 未启用（跨日标的对齐复杂，留待后续）
            dates_per_step: 64   # 每步采样 64 个交易日（每日全横截面；组合 loss 等效样本数=天数，
                                 # 64 天≈525 样本，与 mse batch 512 对齐；16 偏小梯度噪声大）
            pt_model_kwargs:
              input_dim: 157   # Alpha158OHLCV 158 维 - DropCol(VWAP0) 1 列 = 157，与标准 Alpha158 对齐

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158OHLCV
                module_path: qlib.contrib.data.handler
                kwargs:
                    start_time: *data_start
                    end_time: *data_end
                    fit_start_time: *train_start
                    fit_end_time: *train_end
                    instruments: *market
                    process_type: "independent"
                    # t+0 成交口径 label：t 日收盘买入持有 1 日的收益 close(t+1)/close(t)-1。
                    # 默认 label 是 T+2 收益（Ref($close,-2)/Ref($close,-1)-1，为 t+1 成交设计）。
                    # 这里必须覆盖，否则训练 loss / val loss+metric / test_ic 都与
                    # signal_shift=0 + deal_price=close（t 日收盘成交）的回测口径错位一天。
                    label: [["Ref($close, -1)/$close - 1"], ["LABEL0"]]
                    infer_processors:
                        - class: DropCol
                          kwargs:
                            col_list: ["VWAP0"]
                        - class: CSZFillna
                          kwargs:
                            fields_group: feature
                        - class: Fillna
                    # label 标准化：RMSScaleNorm（只缩放不中心化，z = r / RMS）。
                    # 组合收益 loss（Σw=1）对中心化不敏感（平移是常数），
                    # 但只缩放语义更忠实：正收益 -> 正 z，为后续非对称惩罚/换手正则留余地。
                    # fit 仅用 [fit_start_time, fit_end_time]=train 段，不泄漏 valid/test。
                    learn_processors:
                        - class: DropCol
                          kwargs:
                            col_list: ["VWAP0"]
                        - class: DropnaProcessor
                          kwargs:
                            fields_group: feature
                        - class: DropnaLabel
                        - class: RMSScaleNorm
                          kwargs:
                            fields_group: label
                        - class: DropnaLabel
            segments:
                train: [*train_start, *train_end]
                valid: [*valid_start, *valid_end]   # TrainVal
                test: [*backtest_start, *backtest_end]  # AB

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>

        - class: SignalDetailRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            skip_existing: False

        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252

        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

        - class: ReportRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            dataset: <DATASET>
            freq: "1day"
            figure_timeout: 30   # 单张图导出超时(秒)，超时跳过避免 kaleido 卡死

qlib_init:
    # 运行时由 daily_update.py / 环境变量注入数据根绝对路径
    provider_uri: "{{ QLIB_DATA_BASE | default('/Users/zengpengxin/workspace/DataBase/Quant/QlibBase') }}/all_weather_data/qlib_all_weather"
    region: cn

mlflow_tracking_uri: "file:./mlruns"
experiment_name: mlp_all_weather

market: &market all
benchmark: &benchmark "510300"

# 时间参数配置（取自 all_weather_data/dataset_split/split_info.json）
time_config:
    data_start: &data_start "2012-05-28"
    data_end: &data_end "2026-08-16"
    train_start: &train_start "2012-05-28"
    train_end: &train_end "2018-04-18"
    valid_start: &valid_start "2018-04-19"
    valid_end: &valid_end "2021-11-12"
    backtest_start: &backtest_start "2021-11-15"
    backtest_end: &backtest_end "2024-05-23"


port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 5
            n_drop: 1
    backtest:
        start_time: *backtest_start
        end_time: *backtest_end
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
            trade_unit: 0.0001

task:
    model:
        class: DNNModelPytorch
        module_path: qlib.contrib.model.pytorch_nn
        kwargs:
            loss: mse
            lr: 0.002
            optimizer: adam
            max_steps: 3000
            batch_size: 512
            GPU: 0           # 无 CUDA 时自动回退 CPU
            weight_decay: 0.0002
            ic_skip_size: 10   # all_weather 仅 ~23 只标的，按日 IC 最小样本数需调低（默认 50）
            pt_model_kwargs:
              input_dim: 5

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: RawFieldsHandler
                module_path: qlib.contrib.data.handler_raw_fields
                kwargs:
                    start_time: *data_start
                    end_time: *data_end
                    fit_start_time: *train_start
                    fit_end_time: *train_end
                    instruments: *market
                    # all_weather_data 仅 dump 了 OHLCV 字段
                    fields:
                        - "$open"
                        - "$high"
                        - "$low"
                        - "$close"
                        - "$volume"
                    field_names:
                        - "open"
                        - "high"
                        - "low"
                        - "close"
                        - "volume"
                    # label 默认 Ref($close,-2)/Ref($close,-1)-1（T+2 收益）
                    # DNN 需要特征清洗：
                    #   learn(DK_L): DropnaLabel + DropnaProcessor(drop 特征 NaN 行，防 loss=NaN) + CSZScoreNorm(label)
                    #   infer: ProcessInf + ZScoreNorm + Fillna（预测/回测阶段填 NaN）
                    infer_processors:
                        - class: ProcessInf
                        - class: ZScoreNorm
                        - class: Fillna
                    learn_processors:
                        - class: DropnaLabel
                        - class: DropnaProcessor
                          kwargs:
                            fields_group: feature
                        - class: CSZScoreNorm
                          kwargs:
                            fields_group: label
                        # CSZScoreNorm 在单样本日（某日仅 1 只标的有数据）会除零产生 NaN，
                        # 必须在其后再 drop 一次 label NaN，否则训练 loss 会永久 NaN
                        - class: DropnaLabel
            segments:
                train: [*train_start, *train_end]
                valid: [*valid_start, *valid_end]
                test: [*backtest_start, *backtest_end]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>

        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252

        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

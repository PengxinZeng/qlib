qlib_init:
    provider_uri: "/Users/zengpengxin/workspace/DataBase/Quant/QlibBase/qlib_data_260415/qlib_etf_index_Extend_wBond"
    region: cn

# MLflow配置 - 指定实验结果保存位置
mlflow_tracking_uri: "file:./mlruns"

# 实验名称
experiment_name: hist_rela_pb_etf

market: &market all
benchmark: &benchmark "510050_CLEAN"

# 回测配置
port_analysis_config: &port_analysis_config
    strategy:
        class: EvenWeightStrategy
        module_path: qlib.contrib.strategy.signal_strategy
        kwargs:
            signal: <PRED>
            risk_degree: 1.0
            max_stock_weight: 1.0
    backtest:
        start_time: "2005-02-23"
        end_time: "2019-10-08"
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
            trade_unit: 0.001

# 任务配置
task:
    model:
        class: HistRelaPBSignal
        module_path: qlib.contrib.model.hist_rela_pb_signal
        kwargs:
            lookback_days: 982       # 历史回看窗口天数
            min_valid_days_ratio: 0.45   # 最小有效数据天数 = int(lookback_days * ratio)
            oversold_threshold: 0.04    # 超卖阈值（买入信号）
            overbought_threshold: 0.76  # 超买阈值（卖出信号）
            volume_threshold: 0.0       # 成交量阈值
            spread_threshold: 5.0       # 股债利差阈值(%)：1/PE_TTM*100 - CN 2Y >= 5.9% 才触发买入
            freq: "day"

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: RawFieldsHandler
                module_path: qlib.contrib.data.handler_raw_fields
                kwargs:
                    start_time: 2005-02-23
                    end_time: 2026-04-13
                    fit_start_time: 2005-02-23
                    fit_end_time: 2017-01-03
                    instruments: *market
                    fields: 
                        - "$open"
                        - "$high"
                        - "$low"
                        - "$close"
                        - "$volume"
                        - "$pb"
                        - "$pb_median"
                        - "$pe_ttm"
                        - "$pe_ttm_median"
                        - "$cn_2y"
                    field_names:
                        - "open"
                        - "high"
                        - "low"
                        - "close"
                        - "volume"
                        - "pb"
                        - "pb_median"
                        - "pe_ttm"
                        - "pe_ttm_median"
                        - "cn_2y"
                    # 只使用ProcessInf处理无穷值
                    infer_processors:
                        - class: ProcessInf
                          kwargs: {}
                    learn_processors:
                        - class: ProcessInf
                          kwargs: {}
            segments:
                train: [2005-02-23, 2017-01-03]
                valid: [2017-01-04, 2019-10-08]
                test: [2005-02-23, 2019-10-08]  # 临时调整为train+valid用于参数调优

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>

        - class: SignalDetailRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            skip_existing: False

        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

        - class: ReportRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            dataset: <DATASET>
            freq: "1day"

qlib_init:
    provider_uri: "/Users/zengpengxin/workspace/DataBase/Quant/QlibBase/qlib_data_260415/qlib_etf_index_Extend"
    region: cn

market: &market all
benchmark: &benchmark "510300_NORMED"

# 数据划分
data_handler_config: &data_handler_config
    start_time: 2005-02-23
    end_time: 2026-04-13
    fit_start_time: 2005-02-23
    fit_end_time: 2017-01-03
    instruments: *market
    label: ["Ref($close, -2)/Ref($close, -1) - 1"]

# 回测配置
port_analysis_config: &port_analysis_config
    strategy:
        class: EvenWeightStrategy
        module_path: qlib.contrib.strategy.signal_strategy
        kwargs:
            signal: <PRED>
            risk_degree: 0.95
    backtest:
        start_time: "2019-10-09"
        end_time: "2026-04-13"
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
            trade_unit: 0.001

# 任务配置
task:
    model:
        class: HistRelaPBSignal
        module_path: qlib.contrib.model.hist_rela_pb_signal
        kwargs:
            k: 20
            n: 5
            oversold_threshold: 0.10
            overbought_threshold: 0.90
            volume_threshold: 0.0
            freq: "day"

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: AlphaETF
                module_path: qlib.contrib.data.handler_etf
                kwargs: *data_handler_config
            segments:
                train: [2005-02-23, 2017-01-03]
                valid: [2017-01-04, 2019-10-08]
                test: [2019-10-09, 2026-04-13]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>

        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
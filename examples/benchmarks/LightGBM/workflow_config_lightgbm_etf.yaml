qlib_init:
    provider_uri: "{{ QLIB_DATA_BASE | default('/Users/zengpengxin/workspace/DataBase/Quant/QlibBase') }}/qlib_data_260415/qlib_data_fix_hfq"
    region: cn
market: &market all
benchmark: &benchmark "510300"
data_handler_config: &data_handler_config
    start_time: 1991-01-29
    end_time: 2026-04-15
    fit_start_time: 1991-01-29
    fit_end_time: 2020-10-23
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
            fields_group: feature
            clip_outlier: true
        - class: Fillna
          kwargs:
            fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
            fields_group: label
    label: ["Ref($close, -2)/Ref($close, -1) - 1"]
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 10
            n_drop: 2
    backtest:
        start_time: 2023-08-08
        end_time: 2026-04-15
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.05
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 10
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: AlphaETF
                module_path: qlib.contrib.data.handler_etf
                kwargs:
                    <<: *data_handler_config
            segments:
                train: [1991-01-29, 2020-10-23]
                valid: [2020-10-26, 2023-08-07]
                test: [2023-08-08, 2026-04-15]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config

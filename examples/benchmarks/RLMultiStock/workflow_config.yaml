qlib_init:
    provider_uri: "/Users/zengpengxin/workspace/DataBase/Quant/QlibBase/qlib_data_260415/qlib_etf_index_Extend_wBond"
    region: cn

# MLflow configuration
mlflow_tracking_uri: "file:./mlruns"

experiment_name: rl_multi_stock_trading

market: &market all
benchmark: &benchmark "510050_CLEAN"

# Time configuration
time_config:
    data_start: &data_start "2005-02-23"
    data_end: &data_end "2026-06-16"
    train_start: &train_start "2005-02-23"
    train_end: &train_end "2017-01-03"
    valid_start: &valid_start "2017-01-04"
    valid_end: &valid_end "2019-10-08"
    backtest_start: &backtest_start "2019-10-09"
    backtest_end: &backtest_end "2026-06-16"

# Backtest configuration
port_analysis_config: &port_analysis_config
    strategy:
        class: PPOTradingStrategy
        module_path: qlib.contrib.strategy.rl_trading_strategy
        kwargs:
            signal: <PRED>
            risk_degree: 1.0
    backtest:
        start_time: *backtest_start
        end_time: *backtest_end
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
            trade_unit: 0.001

# Task configuration
task:
    model:
        class: PPOModel
        module_path: qlib.rl.models.ppo_model
        kwargs:
            config:
                lookback_window: 1000
                projection_dim: 16
                num_heads: 8
                actor_hidden_dim: 64
                critic_hidden_dim: 64
                
                # Feature dimensions — 5 kline + 4 valuation + 6 macro
                n_kline_features: 5
                n_valuation_features: 4
                n_macro_features: 6
                
                # Training params
                rollout_days: 32
                update_epochs: 1
                batch_size: 32
                learning_rate: 1.0e-4
                total_updates: 5
                
                # PPO params
                gamma: 0.99
                gae_lambda: 0.95
                clip_ratio: 0.2
                value_coef: 0.5
                entropy_coef: 0.01
                
                # Trading
                transaction_cost: 0.0005
                seed: 42
                val_freq: 1
                patience: 3

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: RawFieldsHandler
                module_path: qlib.contrib.data.handler_raw_fields
                kwargs:
                    start_time: *data_start
                    end_time: *data_end
                    fit_start_time: *train_start
                    fit_end_time: *train_end
                    instruments: *market
                    fields: 
                        - "$open"
                        - "$high"
                        - "$low"
                        - "$close"
                        - "$volume"
                        - "$amount"
                        - "$pb"
                        - "$pb_median"
                        - "$pe_ttm"
                        - "$pe_ttm_median"
                        - "$cn_2y"
                        - "$cn_5y"
                        - "$cn_10y"
                        - "$us_2y"
                        - "$us_5y"
                        - "$us_10y"
                    field_names:
                        - "open"
                        - "high"
                        - "low"
                        - "close"
                        - "volume"
                        - "amount"
                        - "pb"
                        - "pb_median"
                        - "pe_ttm"
                        - "pe_ttm_median"
                        - "cn_2y"
                        - "cn_5y"
                        - "cn_10y"
                        - "us_2y"
                        - "us_5y"
                        - "us_10y"
                    infer_processors:
                        - class: ProcessInf
                          kwargs: {}
                    learn_processors:
                        - class: ProcessInf
                          kwargs: {}
            segments:
                train: [*train_start, *train_end]
                valid: [*valid_start, *valid_end]
                test: [*backtest_start, *backtest_end]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>

        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

        - class: ReportRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            dataset: <DATASET>
            freq: "1day"

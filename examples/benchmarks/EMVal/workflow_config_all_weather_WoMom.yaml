qlib_init:
    # 运行时由 daily_update.py 注入数据根绝对路径
    provider_uri: "D:/Pengxin/CodeBase/Quant/QuantDataBank/all_weather_data/qlib_all_weather"
    region: cn

mlflow_tracking_uri: "file:./mlruns"
experiment_name: em_val_all_weather_womom

market: &market all
benchmark: &benchmark "510300"
buy_rank_thre: &buy_rank_thre 0.07
sell_rank_thre: &sell_rank_thre 0.94

# 时间参数配置（取自 all_weather_data/dataset_split/split_info.json）
time_config:
    data_start: &data_start "2012-05-28"
    data_end: &data_end "2026-08-16"
    train_start: &train_start "2012-05-28"
    train_end: &train_end "2018-04-18"
    valid_start: &valid_start "2018-04-19"
    valid_end: &valid_end "2021-11-12"
    backtest_start: &backtest_start "2012-05-28"
    backtest_end: &backtest_end "2026-08-16"

port_analysis_config: &port_analysis_config
    strategy:
        class: EvenWeightStrategy
        module_path: qlib.contrib.strategy.signal_strategy
        kwargs:
            signal: <PRED>
            risk_degree: 1.0
            max_stock_weight: 1.0
    backtest:
        start_time: *backtest_start
        end_time: *backtest_end
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
            trade_unit: 0.0001

task:
    model:
        class: EMValModel
        module_path: qlib.contrib.model.em_val
        kwargs:
            fast: 17
            mid: 23
            slow: 5302.0
            Nt: 1613.0
            epsilon: null
            min_valid_days_ratio: 0.30   # 最小有效数据天数 = int(lookback_days * ratio)
            buy_rank_thre: *buy_rank_thre
            sell_rank_thre: *sell_rank_thre

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: RawFieldsHandler
                module_path: qlib.contrib.data.handler_raw_fields
                kwargs:
                    start_time: *data_start
                    end_time: *data_end
                    fit_start_time: *train_start
                    fit_end_time: *train_end
                    instruments: *market
                    # all_weather_data 仅 dump 了 OHLCV 字段
                    fields:
                        - "$close"
                        - "$volume"
                    field_names:
                        - "close"
                        - "volume"
                    # OHLCV 无 inf、MACD 自行处理 NaN，故不需要 processor
                    infer_processors: []
                    learn_processors: []
            segments:
                train: [*train_start, *train_end]
                valid: [*valid_start, *valid_end]
                test: [*backtest_start, *backtest_end]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>

        - class: SignalDetailRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            skip_existing: False

        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

        - class: ReportRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            dataset: <DATASET>
            freq: "1day"
            figure_timeout: 30   # 单张图导出超时(秒)，超时跳过避免 kaleido 卡死

        - class: EMValChartRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            dataset: <DATASET>
            buy_rank_thre: *buy_rank_thre
            sell_rank_thre: *sell_rank_thre

# nohup python -u qlib/cli/run.py  examples/benchmarks/EMVal/workflow_config_all_weather_WoMom.yaml > output/EMval_WoMom_Test.log 2>&1 &

qlib_init:
    provider_uri: "{{ QLIB_DATA_BASE | default('/Users/zengpengxin/workspace/DataBase/Quant/QlibBase') }}/qlib_data_260415/qlib_data_fix_hfq"
    region: cn

# MLflow配置 - 指定实验结果保存位置
mlflow_tracking_uri: "file:./mlruns"

# 实验名称
experiment_name: topk_allin

market: &market all
benchmark: &benchmark "510300"

# 时间参数配置 (train用于选股, valid预留, test用于回测)
time_config:
    data_start: &data_start "1991-01-29"
    data_end: &data_end "2026-04-15"
    train_start: &train_start "1991-01-29"
    train_end: &train_end "2020-10-23"
    valid_start: &valid_start "2020-10-26"
    valid_end: &valid_end "2023-08-07"
    backtest_start: &backtest_start "2023-08-08"
    backtest_end: &backtest_end "2026-04-15"

# 回测配置
port_analysis_config: &port_analysis_config
    strategy:
        class: EvenWeightStrategy
        module_path: qlib.contrib.strategy.signal_strategy
        kwargs:
            signal: <PRED>
            risk_degree: 1.0
            max_stock_weight: 1.0
    backtest:
        start_time: *backtest_start
        end_time: *backtest_end
        account: 1000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.10
            deal_price: close
            open_cost: 0.0003
            close_cost: 0.0003
            min_cost: 5
            trade_unit: 100

# 任务配置
task:
    model:
        class: TopkAllInSignal
        module_path: qlib.contrib.model.topk_allin_signal
        kwargs:
            top_k: 1

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: RawFieldsHandler
                module_path: qlib.contrib.data.handler_raw_fields
                kwargs:
                    start_time: *data_start
                    end_time: *data_end
                    fit_start_time: *train_start
                    fit_end_time: *train_end
                    instruments: *market
                    fields:
                        - "$close"
                        - "$volume"
                    field_names:
                        - "close"
                        - "volume"
                    # 保持原始值：仅处理无穷值，不做归一化（选股依赖真实收益）
                    infer_processors:
                        - class: ProcessInf
                          kwargs: {}
                    learn_processors:
                        - class: ProcessInf
                          kwargs: {}
            segments:
                train: [*train_start, *train_end]
                valid: [*valid_start, *valid_end]
                test: [*backtest_start, *backtest_end]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>

        - class: SignalDetailRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            skip_existing: False

        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config

        - class: ReportRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            dataset: <DATASET>
            freq: "1day"
